[project]
name = "tabdgp"
version = "0.2.0"
description = "A data-generating process for grouped and flat tables, to be matched to a registry of real tables"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Kipnis", email = "adkipnis@users.noreply.github.com" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.3,<3",
    "pydantic>=2.12,<3",
]

[project.urls]
Repository = "https://github.com/adkipnis/tabdgp"
Issues = "https://github.com/adkipnis/tabdgp/issues"

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "ipykernel",
]

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 licence expression and licence files
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabdgp"]

[tool.hatch.build.targets.sdist]
exclude = ["/docs"]  # the ADRs and conventions are read on GitHub, not in the sdist

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = ["RUF015"]  # suggests next() on a generator, which the conventions rule out

[tool.ruff.lint.per-file-ignores]
"tests/test_readme.py" = ["S102"]  # runs the README's quickstart

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' --import-mode=importlib"
pythonpath = ["."]
markers = [
    "slow: draws thousands of datasets (the proofs against mixedbench's registry); runs by `-m slow`",
]
