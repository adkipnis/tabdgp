# Format check and the fast tests on three operating systems; the slow proofs run by hand or
# on the cluster (`uv run pytest -m slow`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no major tag
        with:
          python-version: '3.14'
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run pytest -rs
