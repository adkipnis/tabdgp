# The release to PyPI by trusted publishing: a published GitHub release uploads its sdist and
# wheel to PyPI; a manual run uploads them to TestPyPI instead, as the dry run. Zenodo
# archives the same release event on its own.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # the build runs without the publishing token
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no major tag
      # PyPI never takes a version twice, so a tag that names another version stops here
      - if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(uv version --short)"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::the tag $TAG does not name the package version $expected"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # the OIDC token PyPI exchanges for a short-lived upload token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@release/v1
      - if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
